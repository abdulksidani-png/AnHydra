<!doctype html>
<!-- Source for the link-preview image. Render with scripts/make_og.py, which writes
     app/static/og.png at 1200x630. Edit this, not the PNG. -->
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;overflow:hidden;position:relative;
    background:
      radial-gradient(760px 520px at 12% -14%, #11384a 0%, transparent 62%),
      radial-gradient(900px 600px at 88% 4%, #0d2c3e 0%, transparent 58%),
      linear-gradient(180deg,#08192600 0%,#040d16 88%), #071420;
    font-family:'Spectral',Georgia,serif; color:#e9f2f7;
    display:flex; align-items:center; gap:56px; padding:0 72px}
  .caustics{position:absolute;inset:-10%;opacity:.3;
    background:repeating-linear-gradient(104deg,transparent 0 38px,rgba(68,211,196,.06) 38px 40px),
               repeating-linear-gradient(76deg,transparent 0 54px,rgba(111,182,255,.045) 54px 56px)}
  .copy{position:relative;flex:1 1 auto;min-width:0}
  .brand{font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1}
  .brand span{color:#44d3c4}
  .line{margin-top:20px;font-size:35px;line-height:1.28;max-width:17ch}
  .line em{font-style:normal;color:#44d3c4}
  .stats{display:flex;gap:40px;margin-top:38px}
  .stat b{display:block;font:500 29px/1 'IBM Plex Mono',monospace;color:#44d3c4}
  .stat span{display:block;margin-top:9px;font-size:16.5px;color:#9fb6c6;max-width:22ch;line-height:1.35}
  .url{position:absolute;left:72px;bottom:44px;
    font:500 20px/1 'IBM Plex Mono',monospace;color:#7f9bad;letter-spacing:.06em}
  figure{position:relative;flex:0 0 400px}
  svg{width:400px;height:auto;display:block}
</style></head>
<body>
<div class="caustics"></div>
<div class="copy">
  <div class="brand">An<span>Hydra</span></div>
  <div class="line">Does this protein look like it can <em>survive drying out?</em></div>
  <div class="stats">
    <div class="stat"><b>0.818 AUC</b><span>on a protein family the model had never seen</span></div>
    <div class="stat"><b>K-segment</b><span>a published motif our CNN found on its own</span></div>

</div>
