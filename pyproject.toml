[project]
name = "tardiscreen"
version = "0.1.0"
description = "Score protein sequences for CAHS-like, desiccation-protective character."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Lightweight core: enough to run the data pipeline and the app.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "scikit-learn>=1.4"]
# The model stack (heavy). Install with:  pip install -e ".[ml]"
ml = [
    "torch>=2.2",
    "transformers>=4.40",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Install for development (makes `from tardiscreen import ...` work everywhere):
#   pip install -e .          # core: data pipeline + app
#   pip install -e ".[ml]"    # + the model stack (torch, transformers, scikit-learn)
